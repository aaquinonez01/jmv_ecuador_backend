x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - web
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "127.0.0.1:5437:5432"
    container_name: jmv_database
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 3g
    cpus: 2.0
    shm_size: 256m
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jmv_backend
    restart: always
    env_file:
      - ./.env
    environment:
      PORT: ${PORT:-3002}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://frontend:3000}
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 1500m
    cpus: 1.5
    logging: *default-logging

  frontend:
    build:
      context: ../jmv_ecuador_web
      dockerfile: Dockerfile
      args:
        SKIP_REMOTE_FETCH: "1"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.jmvecuador.org/api}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3002/api}
    container_name: jmv_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.jmvecuador.org/api}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3002/api}
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

networks:
  web:
    driver: bridge
