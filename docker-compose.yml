x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Panel de administración de NPM: solo accesible por túnel SSH
      # (ssh -L 8181:localhost:81 root@<IP>  →  http://localhost:8181)
      - "127.0.0.1:81:81"
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - web
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "127.0.0.1:5437:5432"
    container_name: jmv_database
    # Ajustes para un VPS de 8 GB compartido con backend, frontend y proxy
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "random_page_cost=1.1"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 2g
    cpus: 2.0
    shm_size: 256m
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jmv_backend
    restart: always
    env_file:
      - ./.env
    environment:
      PORT: ${PORT:-3002}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://frontend:3000}
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN}
      # PDF de la biblioteca: se guardan en el volumen library_files
      LIBRARY_STORAGE_DIR: /app/uploads/library
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.jmvecuador.org/api}
    volumes:
      - library_files:/app/uploads/library
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    cpus: 1.5
    logging: *default-logging

  frontend:
    build:
      context: ../jmv_ecuador_web
      dockerfile: Dockerfile
      args:
        # En el build el contenedor no está en la red "web": se usa la API pública
        # para prerenderizar las páginas con datos reales (si falla, se regeneran luego)
        SKIP_REMOTE_FETCH: "0"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.jmvecuador.org/api}
        INTERNAL_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.jmvecuador.org/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://jmvecuador.org}
    container_name: jmv_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.jmvecuador.org/api}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3002/api}
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN}
      # IP del visitante firmada para el límite del formulario de contacto
      INTERNAL_PROXY_KEY: ${INTERNAL_PROXY_KEY:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://jmvecuador.org}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    volumes:
      # Imágenes ya optimizadas por next/image: se conservan entre despliegues
      - next_image_cache:/app/.next/cache/images
    networks:
      - web
    mem_limit: 1536m
    # El frontend atiende casi todo el tráfico público: puede usar los 2 núcleos
    # (es un tope, no una reserva; se comparten con los demás servicios).
    cpus: 2.0
    logging: *default-logging

volumes:
  next_image_cache:
  # PDF subidos a la Biblioteca JMV (incluirlo en los respaldos del VPS)
  library_files:

networks:
  web:
    driver: bridge
