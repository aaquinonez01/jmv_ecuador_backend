services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5437:5432" # ← Cambia a 5437:5432 para que sea accesible externamente
    container_name: jmv_database
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jmv_backend
    restart: always
    env_file:
      - ./.env
    environment:
      PORT: ${PORT:-3002}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    depends_on:
      - db
    ports:
      - "3002:3002"
  frontend:
    build:
      context: ../jmv_ecuador_web
      dockerfile: Dockerfile
      args:
        SKIP_REMOTE_FETCH: "1"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://66.94.116.56:3002/api} # ← se inlinea en el bundle del navegador
    container_name: jmv_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://66.94.116.56:3002/api}
      INTERNAL_API_URL: http://backend:3002/api
      NODE_ENV: production
    depends_on:
      - backend
    ports:
      - "3000:3000"
