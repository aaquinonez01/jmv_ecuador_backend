services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - web

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "127.0.0.1:5437:5432"
    container_name: jmv_database
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - web

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jmv_backend
    restart: always
    env_file:
      - ./.env
    environment:
      PORT: ${PORT:-3002}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    depends_on:
      - db
    networks:
      - web

  frontend:
    build:
      context: ../jmv_ecuador_web
      dockerfile: Dockerfile
      args:
        SKIP_REMOTE_FETCH: "1"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.jmvecuador.org/api}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3002/api}
    container_name: jmv_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.jmvecuador.org/api}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3002/api}
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - web

networks:
  web:
    driver: bridge
